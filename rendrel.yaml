services:
  - type: web
    name: medusajs-backend
    env: node
    plan: free                  # use 'starter' or 'standard' for production
    region: oregon              # or frankfurt / singapore / etc.
    buildCommand: |
      npm install
      npm run build
    startCommand: |
      npm run start
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # CORS settings for your admin & storefront (update these)
      - key: MEDUSA_ADMIN_CORS
        value: https://your-admin-domain.com
      - key: MEDUSA_STORE_CORS
        value: https://your-store-domain.com

      # Link the Render PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: medusajs-db
          property: connectionString

      # Secrets (auto-generated by Render)
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true

      # Optional: Redis if you add it later
      # - key: REDIS_URL
      #   value: redis://default:password@host:6379

      # Optional: Add API keys for payment providers, etc.
      # - key: STRIPE_API_KEY
      #   sync: false
      # - key: STRIPE_WEBHOOK_SECRET
      #   sync: false

databases:
  - name: medusajs-db
    plan: free
